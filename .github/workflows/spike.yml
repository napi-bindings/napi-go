# Phase 0 — napi-go feasibility spike.
# Covers platforms that could not be tested locally (macOS, Linux arm64,
# Alpine/musl, Windows with mingw-gcc) and runs Linux/Windows across multiple Node and Go versions.
name: spike

on:
  push:
    paths: ['spike/**', '.github/workflows/spike.yml']
  pull_request:
    paths: ['spike/**', '.github/workflows/spike.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: spike
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }} · go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25   # a hung test must not block the runner for hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        node: ['22', '24', '26']
        go: ['1.24.x', 'stable']
        include:
          - os: ubuntu-latest
            node: 'current'
            go: 'stable'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: spike/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Toolchain
        run: go version && node --version && (gcc --version || cc --version) | head -1
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: node scripts/build.mjs
      - name: Test
        run: node --test --test-timeout=180000 --test-reporter=spec test/*.test.mjs
      - name: WebAssembly trap diagnostics
        if: ${{ !cancelled() }}
        run: node experiments/wasmtrap/trap.mjs
      - name: SA_RESETHAND diagnostics (read-back + reinstall, like Go setsigstack)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        continue-on-error: true   # describes OS behavior, not napi-go
        run: cc -O2 -o "$RUNNER_TEMP/sigflags" experiments/sigflags/sigflags.c && "$RUNNER_TEMP/sigflags"
      - name: Benchmark
        run: node test/bench.mjs
      - name: C→Go callback cost
        working-directory: spike/experiments/cbcost
        run: go run .

  cgocheck2:
    name: ubuntu · GOEXPERIMENT=cgocheck2
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a hung test must not block the runner for hours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: spike/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node scripts/build.mjs
        env:
          GOEXPERIMENT: cgocheck2
      - run: node --test --test-timeout=180000 --test-reporter=spec test/*.test.mjs

  windows-zig:
    name: windows · zig cc
    runs-on: windows-latest
    timeout-minutes: 25   # a hung test must not block the runner for hours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: spike/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: mlugg/setup-zig@v2
      - run: zig version && go version && node --version
      - run: node scripts/build.mjs
        env:
          CC: zig cc
      - run: node --test --test-timeout=180000 --test-reporter=spec test/*.test.mjs
      - name: WebAssembly trap diagnostics
        if: ${{ !cancelled() }}
        run: node experiments/wasmtrap/trap.mjs
      - name: C→Go callback cost
        if: ${{ !cancelled() }}
        working-directory: spike/experiments/cbcost
        run: go run .
        env:
          CC: zig cc

  alpine:
    # Q7 — known limitation (Go ≤ 1.27): the Go runtime in c-shared uses initial-exec TLS and expects
    # argc/argv in init functions; musl rejects dlopen ("initial-exec TLS resolves to dynamic
    # definition"). Upstream fix: golang/go#71953, CL 696635.
    # Sentinel: the dlopen probe distinguishes three outcomes. Known error with Alpine's Go → warning
    # and green job (tests skipped); successful load → run all tests; any other error → red job.
    # The go=cl696635 variant builds Go from the latest patchset of the CL (still open) and verifies
    # ahead of time that the fix is sufficient for napi-go: there, even the known error is a failure.
    # For c-shared, the CL already selects the general-dynamic model (-tls=auto), so the addon build
    # remains identical.
    name: alpine (musl) · node ${{ matrix.node }} · go ${{ matrix.go }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.go == 'cl696635' }}   # an unmerged CL may break: do not block the pipeline
    timeout-minutes: 25   # a hung test must not block the runner for hours
    container: node:${{ matrix.node }}-alpine
    defaults:
      run:
        shell: sh   # the alpine image has no bash: the workflow default would fail before installing it
        working-directory: spike
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        go: ['alpine']   # Alpine package Go: reproduces the known limitation
        include:
          - node: '26'
            go: 'cl696635'
    steps:
      - name: Dependencies
        working-directory: /
        run: apk add --no-cache go gcc musl-dev git
      - uses: actions/checkout@v5
      - name: Go from CL 696635 (latest patchset, bootstrapped with Alpine Go)
        if: matrix.go == 'cl696635'
        working-directory: /
        run: |
          apk add --no-cache bash   # required by make.bash
          ref=$(git ls-remote https://go.googlesource.com/go 'refs/changes/35/696635/*' | awk '{print $2}' | grep -E '/[0-9]+$' | sort -t/ -k5,5n | tail -1)
          test -n "$ref"
          echo "CL 696635: $ref"
          git init -q /opt/go-cl
          git -C /opt/go-cl fetch -q --depth=1 https://go.googlesource.com/go "$ref"
          git -C /opt/go-cl checkout -q FETCH_HEAD
          git -C /opt/go-cl log -1 --format='%H %s'
          cd /opt/go-cl/src && GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash
          echo /opt/go-cl/bin >> "$GITHUB_PATH"
      - name: Toolchain
        run: go version && node --version && gcc --version | head -1
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: node scripts/build.mjs
      - name: TLS model of .node (TPOFF64 = initial-exec, TLSGD/TLSDESC = general dynamic)
        run: readelf -d build/basic.node | grep -i flags; readelf -r build/basic.node | grep -E 'TPOFF|TLSGD|TLSDESC|DTPMOD' || true
      - name: dlopen probe (known limitation Q7 → warning, other errors → red job)
        id: probe
        run: |
          if out=$(timeout 60 node -e "require('./build/basic.node'); require('./build/second.node')" 2>&1); then
            echo "loaded=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=musl::dlopen succeeded with $(go version): running all tests"
          elif [ '${{ matrix.go }}' = alpine ] && printf '%s' "$out" | grep -q 'initial-exec TLS resolves to dynamic definition'; then
            echo "loaded=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=musl: known limitation Q7::$(go version): musl rejects Go runtime initial-exec TLS, tests skipped (golang/go#71953, CL 696635)"
          else
            printf '%s\n' "$out"
            echo "::error title=musl::dlopen failed (or hung) with an outcome other than known limitation Q7"
            exit 1
          fi
      - name: Test
        if: steps.probe.outputs.loaded == 'true'
        run: node --test --test-timeout=180000 --test-reporter=spec test/*.test.mjs
      - name: Benchmark
        if: steps.probe.outputs.loaded == 'true'
        run: node test/bench.mjs
