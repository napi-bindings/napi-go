# Layer 0 (package sys) and Layer 1 (package napi): code generator, Go unit tests, and
# end-to-end tests with Node.js.
#
#   generate    up-to-date generated files, gofmt, go vet, and go test across all version build tags,
#               plus go test -race on package napi
#   e2e         test addons + node:test on Linux x64/arm64, macOS arm64/x64, Windows (gcc),
#               followed by the Node.js test suite ported to sys (tests/nodesuite)
#   cgocheck2   e2e and nodesuite with GOEXPERIMENT=cgocheck2 (cgo pointer checks)
#   windows-zig e2e and nodesuite on Windows built with zig cc
name: sys

on:
  push:
    paths: ['go.mod', 'sys/**', 'napi/**', 'tests/e2e/**', 'tests/nodesuite/**', '.github/workflows/sys.yml']
  pull_request:
    paths: ['go.mod', 'sys/**', 'napi/**', 'tests/e2e/**', 'tests/nodesuite/**', '.github/workflows/sys.yml']
  workflow_dispatch:

permissions:
  contents: read

# A new push on the same ref cancels the previous in-progress run.
concurrency:
  group: sys-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: generator and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generated files up to date
        working-directory: sys
        run: go run ./internal/gen -check
      - name: gofmt
        run: test -z "$(gofmt -l sys napi tests)" || (gofmt -l sys napi tests && exit 1)
      - name: go vet (all version build tags)
        run: |
          for tags in "" napi_go_v9 napi_go_v10 napi_go_experimental napi_go_test_version_mismatch; do
            echo "== tags: ${tags:-default}"
            go vet -tags "$tags" ./sys/... ./napi/... ./tests/...
          done
      - name: go test (all version build tags)
        run: |
          for tags in "" napi_go_v9 napi_go_v10 napi_go_experimental napi_go_test_version_mismatch; do
            go test -count=1 -tags "$tags" ./sys/... ./napi/...
          done
      - name: go test -race (napi)
        run: go test -count=1 -race ./napi/...

  e2e:
    name: ${{ matrix.os }} · node ${{ matrix.node }} · go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        node: ['22', '24', '26']
        go: ['1.24.x', 'stable']
        include:
          - os: ubuntu-latest
            node: 'current'
            go: 'stable'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Toolchain
        run: go version && node --version && node -p "'Node-API ' + process.versions.napi"
      - name: go test ./sys ./napi
        run: go test -count=1 ./sys/... ./napi/...
      - name: Build e2e addons
        env:
          CGO_ENABLED: '1'
        run: node tests/e2e/build.mjs
      - name: E2E tests
        run: node --test --test-timeout=180000 --test-reporter=spec tests/e2e/*.test.mjs
      - name: Node.js test suite (js-native-api, node-api)
        env:
          CGO_ENABLED: '1'
        run: node tests/nodesuite/run.mjs

  cgocheck2:
    name: ubuntu · GOEXPERIMENT=cgocheck2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: go test -count=1 ./sys/... ./napi/...
        env:
          GOEXPERIMENT: cgocheck2
      - run: node tests/e2e/build.mjs
        env:
          GOEXPERIMENT: cgocheck2
      - run: node --test --test-timeout=180000 --test-reporter=spec tests/e2e/*.test.mjs
      - run: node tests/nodesuite/run.mjs
        env:
          GOEXPERIMENT: cgocheck2

  windows-zig:
    name: windows · zig cc
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: mlugg/setup-zig@v2
      - run: zig version && go version && node --version
      - run: go test -count=1 ./sys/... ./napi/...
        env:
          CC: zig cc
      - run: node tests/e2e/build.mjs
        env:
          CC: zig cc
      - run: node --test --test-timeout=180000 --test-reporter=spec tests/e2e/*.test.mjs
      - run: node tests/nodesuite/run.mjs
        env:
          CC: zig cc
