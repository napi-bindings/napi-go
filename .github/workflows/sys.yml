# Layer 0 (pacchetto sys) e Layer 1 (pacchetto napi): generatore, test unitari Go e test
# end-to-end con Node.js.
#
#   generate    file generati aggiornati, gofmt, go vet e go test con ogni build tag di versione,
#               go test -race del pacchetto napi
#   e2e         addon di test + node:test su Linux x64/arm64, macOS arm64/x64, Windows (gcc),
#               poi i test della suite di Node.js portati su sys (tests/nodesuite)
#   cgocheck2   e2e e nodesuite con GOEXPERIMENT=cgocheck2 (regole sui puntatori di cgo)
#   windows-zig e2e e nodesuite su Windows compilando con zig cc
name: sys

on:
  push:
    paths: ['go.mod', 'sys/**', 'napi/**', 'tests/e2e/**', 'tests/nodesuite/**', '.github/workflows/sys.yml']
  pull_request:
    paths: ['go.mod', 'sys/**', 'napi/**', 'tests/e2e/**', 'tests/nodesuite/**', '.github/workflows/sys.yml']
  workflow_dispatch:

permissions:
  contents: read

# Un nuovo push sullo stesso ramo annulla il run precedente ancora in corso.
concurrency:
  group: sys-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: generatore e test unitari
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: File generati aggiornati
        working-directory: sys
        run: go run ./internal/gen -check
      - name: gofmt
        run: test -z "$(gofmt -l sys napi tests)" || (gofmt -l sys napi tests && exit 1)
      - name: go vet (tutti i build tag di versione)
        run: |
          for tags in "" napi_go_v9 napi_go_v10 napi_go_experimental napi_go_test_version_mismatch; do
            echo "== tags: ${tags:-default}"
            go vet -tags "$tags" ./sys/... ./napi/... ./tests/...
          done
      - name: go test (tutti i build tag di versione)
        run: |
          for tags in "" napi_go_v9 napi_go_v10 napi_go_experimental napi_go_test_version_mismatch; do
            go test -count=1 -tags "$tags" ./sys/... ./napi/...
          done
      - name: go test -race (napi)
        run: go test -count=1 -race ./napi/...

  e2e:
    name: ${{ matrix.os }} · node ${{ matrix.node }} · go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        node: ['22', '24', '26']
        go: ['1.24.x', 'stable']
        include:
          - os: ubuntu-latest
            node: 'current'
            go: 'stable'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Toolchain
        run: go version && node --version && node -p "'Node-API ' + process.versions.napi"
      - name: go test ./sys ./napi
        run: go test -count=1 ./sys/... ./napi/...
      - name: Build addon e2e
        env:
          CGO_ENABLED: '1'
        run: node tests/e2e/build.mjs
      - name: Test e2e
        run: node --test --test-timeout=180000 --test-reporter=spec tests/e2e/*.test.mjs
      - name: Suite Node.js (js-native-api, node-api)
        env:
          CGO_ENABLED: '1'
        run: node tests/nodesuite/run.mjs

  cgocheck2:
    name: ubuntu · GOEXPERIMENT=cgocheck2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: go test -count=1 ./sys/... ./napi/...
        env:
          GOEXPERIMENT: cgocheck2
      - run: node tests/e2e/build.mjs
        env:
          GOEXPERIMENT: cgocheck2
      - run: node --test --test-timeout=180000 --test-reporter=spec tests/e2e/*.test.mjs
      - run: node tests/nodesuite/run.mjs
        env:
          GOEXPERIMENT: cgocheck2

  windows-zig:
    name: windows · zig cc
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: mlugg/setup-zig@v2
      - run: zig version && go version && node --version
      - run: go test -count=1 ./sys/... ./napi/...
        env:
          CC: zig cc
      - run: node tests/e2e/build.mjs
        env:
          CC: zig cc
      - run: node --test --test-timeout=180000 --test-reporter=spec tests/e2e/*.test.mjs
      - run: node tests/nodesuite/run.mjs
        env:
          CC: zig cc
