# Release of a version tag v<major>.<minor>.<patch>[-<pre-release>] (docs/releasing.md):
#
#   check   the tag matches a version section of CHANGELOG.md with a date (not "unreleased")
#   cli     the CLI built for six platforms (pure Go), with SHA256SUMS; each binary reports the tag
#   smoke   on Linux, macOS and Windows, a project created with go run …/cmd/napi-go@<tag> new,
#           fetched from GitHub as a user would (GOPRIVATE bypasses the module proxy, which may
#           not have the tag yet), built and tested
#   release the GitHub release, with the notes of CHANGELOG.md and the CLI binaries
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MODULE: github.com/napi-bindings/napi-go
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $TAG is not v<semver>"; exit 1; }
          header=$(grep -E "^## \[$version\] - " CHANGELOG.md || true)
          [ -n "$header" ] || { echo "::error::CHANGELOG.md has no section [$version]"; exit 1; }
          [[ "$header" =~ \ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::the section [$version] of CHANGELOG.md has no date: $header"; exit 1; }
          awk -v h="$header" '$0 == h { on = 1; next } on && /^## \[/ { exit } on && /^\[[^]]+\]: / { exit } on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty release notes"; exit 1; }
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  cli:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # go build stamps the version of the main module from the tag
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build
        run: |
          mkdir dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${p%/*} arch=${p#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/napi-go_${TAG}_${os}_${arch}${ext}" ./cmd/napi-go
          done
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: The binaries report the tag
        run: |
          out=$("dist/napi-go_${TAG}_linux_amd64" version)
          echo "$out"
          [ "$out" = "napi-go $TAG" ] || { echo "::error::version is '$out', want 'napi-go $TAG'"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  smoke:
    needs: check
    name: smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOPRIVATE: github.com/napi-bindings/napi-go
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
      - name: napi-go new, build, test
        working-directory: ${{ runner.temp }}
        run: |
          go run "$MODULE/cmd/napi-go@$TAG" new demo
          cd demo
          grep -F "$MODULE $TAG" go.mod
          go tool napi-go version | tee /dev/stderr | grep -Fx "napi-go $TAG"
          npm run build
          npm test

  release:
    needs: [check, cli, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ needs.check.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "$TAG" artifacts/cli/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "napi-go $TAG" --notes-file artifacts/notes/notes.md "${flags[@]}"
